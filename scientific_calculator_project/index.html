<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C Scientific Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div>
      <h1>Scientific Calculator</h1>
      <p>C-powered calculator • WebAssembly</p>
    </div>
    <button id="themeToggle" class="theme-btn">☾</button>
  </header>

  <section class="calculator">
    <div class="display">
      <div class="display-mode">MODE: <span id="modeName">COMP</span></div>
      <div id="expression">Ready</div>
      <div id="result">0</div>
    </div>

    <nav class="modes">
      <button class="mode active" data-mode="comp">COMP</button>
      <button class="mode" data-mode="complex">COMPLEX</button>
      <button class="mode" data-mode="equation">EQUATION</button>
      <button class="mode" data-mode="base">BASE-N</button>
      <button class="mode" data-mode="matrix">MATRIX</button>
      <button class="mode" data-mode="vector">VECTOR</button>
    </nav>

    <div class="workspace">
      <section class="keypad-wrap">
        <div class="keypad">
          <button class="key fn" data-action="clear">AC</button>
          <button class="key fn" data-action="backspace">DEL</button>
          <button class="key fn" data-action="open">(</button>
          <button class="key fn" data-action="close">)</button>
          <button class="key fn" data-action="sqrt">√</button>
          <button class="key fn" data-action="square">x²</button>
          <button class="key fn" data-action="pi">π</button>

          <button class="key" data-value="7">7</button>
          <button class="key" data-value="8">8</button>
          <button class="key" data-value="9">9</button>
          <button class="key op" data-value="/">÷</button>
          <button class="key fn" data-action="sin">sin</button>
          <button class="key fn" data-action="cos">cos</button>
          <button class="key fn" data-action="tan">tan</button>

          <button class="key" data-value="4">4</button>
          <button class="key" data-value="5">5</button>
          <button class="key" data-value="6">6</button>
          <button class="key op" data-value="*">×</button>
          <button class="key fn" data-action="log">log</button>
          <button class="key fn" data-action="ln">ln</button>
          <button class="key fn" data-action="inv">x⁻¹</button>

          <button class="key" data-value="1">1</button>
          <button class="key" data-value="2">2</button>
          <button class="key" data-value="3">3</button>
          <button class="key op" data-value="-">−</button>
          <button class="key fn" data-action="asin">sin⁻¹</button>
          <button class="key fn" data-action="acos">cos⁻¹</button>
          <button class="key fn" data-action="atan">tan⁻¹</button>

          <button class="key wide" data-value="0">0</button>
          <button class="key" data-value=".">.</button>
          <button class="key op" data-value="+">+</button>
          <button class="key fn" data-action="ans">Ans</button>
          <button class="key equals" data-action="equals">=</button>
        </div>
      </section>

      <section class="panel-area">
        <!-- COMP -->
        <div class="panel active-panel" id="panel-comp">
          <h2>COMP MODE</h2>
          <p>Enter an expression using +, -, *, / and parentheses.</p>
          <input id="compInput" placeholder="Example: (25+5)*2">
          <button class="primary" id="compCalc">Calculate</button>
        </div>

        <!-- COMPLEX -->
        <div class="panel" id="panel-complex">
          <h2>COMPLEX NUMBER MODE</h2>
          <select id="complexOp">
            <option value="add">Addition</option>
            <option value="sub">Subtraction</option>
            <option value="mul">Multiplication</option>
            <option value="div">Division</option>
            <option value="magarg">Magnitude & Argument</option>
          </select>
          <div class="grid2">
            <label>z1 real<input id="c1r" type="number" step="any"></label>
            <label>z1 imag<input id="c1i" type="number" step="any"></label>
            <label>z2 real<input id="c2r" type="number" step="any"></label>
            <label>z2 imag<input id="c2i" type="number" step="any"></label>
          </div>
          <button class="primary" id="complexCalc">Calculate</button>
        </div>

        <!-- EQUATION -->
        <div class="panel" id="panel-equation">
          <h2>EQUATION MODE</h2>
          <select id="eqType">
            <option value="2">Two linear equations</option>
            <option value="3">Three linear equations</option>
            <option value="quadratic">Quadratic</option>
            <option value="cubic">Cubic</option>
          </select>
          <div id="eqInputs"></div>
          <button class="primary" id="equationCalc">Solve</button>
        </div>

        <!-- BASE -->
        <div class="panel" id="panel-base">
          <h2>BASE-N MODE</h2>
          <select id="baseType">
            <option value="2">Decimal → Binary</option>
            <option value="8">Decimal → Octal</option>
            <option value="16">Decimal → Hexadecimal</option>
          </select>
          <input id="baseNumber" type="number" step="1" placeholder="Enter decimal number">
          <button class="primary" id="baseCalc">Convert</button>
        </div>

        <!-- MATRIX -->
        <div class="panel" id="panel-matrix">
          <h2>MATRIX MODE</h2>
          <div class="row">
            <select id="matrixSize"><option value="2">2 × 2</option><option value="3">3 × 3</option></select>
            <select id="matrixOp">
              <option value="det">Determinant</option>
              <option value="transpose">Transpose</option>
              <option value="inverse">Inverse</option>
              <option value="add">Addition</option>
              <option value="sub">Subtraction</option>
              <option value="mul">Multiplication</option>
            </select>
          </div>
          <div id="matrixInputs"></div>
          <button class="primary" id="matrixCalc">Calculate</button>
        </div>

        <!-- VECTOR -->
        <div class="panel" id="panel-vector">
          <h2>VECTOR MODE</h2>
          <select id="vectorType"><option value="2">2D</option><option value="3">3D</option></select>
          <select id="vectorOp">
            <option value="add">Addition</option>
            <option value="sub">Subtraction</option>
            <option value="dot">Dot Product</option>
            <option value="cross">Cross Product</option>
          </select>
          <div id="vectorInputs"></div>
          <button class="primary" id="vectorCalc">Calculate</button>
        </div>
      </section>
    </div>

    <section class="output">
      <div class="output-head"><h2>Output</h2><button id="clearOutput">Clear</button></div>
      <pre id="outputText">WASM is loading...</pre>
    </section>
  </section>

  <footer>C scientific calculator compiled to WebAssembly</footer>
</div>
<script src="calculator.js"></script>
<script src="script.js"></script>
</body>
</html>
